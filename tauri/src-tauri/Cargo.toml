[package]
name = "dsh-pet-desktop"
version = "0.1.0"
description = "dsh-pet 桌宠的 Tauri 外壳（Fedora / Linux 独立运行）"
authors = ["dsh-pet tauri shell"]
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "dsh-pet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
x11-dl = "2"
gtk = "0.18"
ksni = { version = "0.3.7", features = ["blocking"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
